{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="max-w-sm w-full theme-bg-secondary p-8 rounded-xl shadow-2xl">
    <div class="text-center mb-8">
      <div
        class="inline-block w-16 h-16 rounded-2xl theme-bg-primary mb-4 flex items-center justify-center"
      >
        <span class="text-3xl">🍹</span>
      </div>
      <h2 class="text-2xl font-bold theme-text-primary">Bienvenue</h2>
      <p class="theme-text-secondary mt-1">Connectez-vous pour continuer</p>
    </div>

    {% if messages %}
    <div class="mb-6">
      {% for message in messages %}
      <div
        class="p-4 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% endif %}"
      >
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium theme-text-secondary mb-2">
          Nom d'utilisateur
        </label>
        <input
          type="text"
          name="username"
          required
          class="w-full p-3 rounded-lg theme-bg-primary theme-text-primary theme-border border focus:ring-2 focus:ring-blue-500 transition-shadow"
        />
      </div>

      <div>
        <label class="block text-sm font-medium theme-text-secondary mb-2">
          Mot de passe
        </label>
        <input
          type="password"
          name="password"
          required
          class="w-full p-3 rounded-lg theme-bg-primary theme-text-primary theme-border border focus:ring-2 focus:ring-blue-500 transition-shadow"
        />
      </div>

      <button
        type="submit"
        class="w-full theme-navy text-white py-3 px-4 rounded-lg hover:opacity-90 transition-opacity font-medium"
      >
        Se connecter
      </button>
    </form>
  </div>
</div>
{% endblock %}
